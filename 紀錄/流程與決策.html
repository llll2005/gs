ul.mech li:first-child { border-top: none; }
.mname { font-weight: 600; }
.mnote { color: var(--muted); font-size: 13.5px; }
details { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
details > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; font-size: 14px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; color: var(--muted); }
details[open] > summary::before { content: "▾ "; }
details .inner { padding: 0 12px 10px; }
.rej-item { padding: 8px 0; border-top: 1px dashed var(--line); }
.rej-item:first-child { border-top: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
.meta { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; font-size: 14px; margin: 6px 0 10px; }
.meta b { color: var(--muted); font-weight: 600; }
.decision { border-left: 3px solid var(--pend); padding: 4px 10px; background: var(--pend-bg); border-radius: 0 8px 8px 0; font-size: 14px; }
.decision.done { border-color: var(--adopt); background: var(--adopt-bg); }
.tcap { font-size: 13.5px; color: var(--muted); margin: 10px 0 4px; }
.tw { max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13.5px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 2; background: var(--th); font-weight: 700; }
th:first-child, td:first-child { position: sticky; left: 0; text-align: left; background: var(--card); z-index: 1; }
th:first-child { z-index: 3; background: var(--th); }

td.g { color: var(--good); font-weight: 600; }
td.b { color: var(--bad); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { ul.mech li { grid-template-columns: 1fr; gap: 2px; } .meta { grid-template-columns: 1fr; } }

<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const el = (t, cls, html) => { const e = document.createElement(t); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  const TAG = {inherit: "沿用", adopted: "我方採用", eng: "工程", pending: "待驗證", rejected: "不採用"};
  document.getElementById("subtitle").textContent = D.subtitle + "（最後更新 " + D.updated + "）";

  const nav = document.getElementById("nav");
  [["#top", "總覽"]].concat(D.stages.map(s => ["#" + s.id, s.title.replace(/^\([a-e]\)\s*/, "")]), [["#pending", "待驗證／待決定"]])
    .forEach(([h, t]) => { const a = el("a", "", esc(t)); a.href = h; nav.appendChild(a); });

  const top = document.getElementById("top");
  const k = el("div", "kpis");
  D.kpis.forEach(x => k.appendChild(el("div", "kpi", `<div class="v">${esc(x.v)}</div><div class="l">${esc(x.l)}</div>`)));
  top.appendChild(k);
  const lg = el("div", "legend");
  ["inherit", "adopted", "eng", "pending", "rejected"].forEach(t => lg.appendChild(el("span", "tag " + t, TAG[t])));
  top.appendChild(lg);

  function table(t) {
    const wrap = el("div", "");
    if (t.cap) wrap.appendChild(el("div", "tcap", esc(t.cap)));
    const tw = el("div", "tw"); const tb = el("table");
    const thead = el("thead"); const tr = el("tr");
    t.cols.forEach(c => tr.appendChild(el("th", "", esc(c)))); thead.appendChild(tr); tb.appendChild(thead);
    const body = el("tbody");
    t.rows.forEach(r => {
      const row = el("tr", r.base ? "base" : "");
      r.c.forEach((v, i) => {
        const cls = (r.good || []).includes(i) ? "g" : (r.bad || []).includes(i) ? "b" : "";
        row.appendChild(el("td", cls, esc(v)));
      });
      body.appendChild(row);
    });
    tb.appendChild(body); tw.appendChild(tb); wrap.appendChild(tw);
    if (t.note) wrap.appendChild(el("p", "note", esc(t.note)));
    return wrap;
  }

  const st = document.getElementById("stages");
  st.appendChild(el("h2", "", "現行流程（新底 3）"));
  D.stages.forEach(s => {
    const c = el("div", "stage"); c.id = s.id;
    c.appendChild(el("h3", "", esc(s.title)));
    if (s.desc) c.appendChild(el("p", "desc", esc(s.desc)));
    s.groups.forEach(g => {
      if (g.name) c.appendChild(el("div", "group", esc(g.name)));
      const ul = el("ul", "mech");
      g.items.forEach(m => ul.appendChild(el("li", "", `<span><span class="tag ${m.tag}">${TAG[m.tag]}</span></span><span><span class="mname">${esc(m.name)}</span>${m.note ? `<div class="mnote">${esc(m.note)}</div>` : ""}</span>`)));
      c.appendChild(ul);
    });
    if (s.rejected && s.rejected.length) {
      const d = el("details"); d.appendChild(el("summary", "", `不採用（${s.rejected.length}）`));
      const inner = el("div", "inner");
      s.rejected.forEach(r => inner.appendChild(el("div", "rej-item", `<span class="tag rejected">不採用</span> <span class="mname">${esc(r.name)}</span><div class="mnote">${esc(r.why)}</div>`)));
      d.appendChild(inner); c.appendChild(d);
    }
    st.appendChild(c);
  });

  const pd = document.getElementById("pending");
  pd.appendChild(el("h2", "", "待驗證／待決定"));
  D.pending.forEach(p => {
    const c = el("div", "card"); c.id = p.id;
    c.appendChild(el("h3", "", `<span class="tag pending">待驗證</span> ${esc(p.title)}`));
    c.appendChild(el("div", "meta", `<b>狀態</b><span>${esc(p.status)}</span><b>下一步</b><span>${esc(p.next)}</span>`));
    c.appendChild(el("div", "decision" + (p.decision ? " done" : ""), p.decision ? "決定：" + esc(p.decision) : "決定：（待定）"));
    (p.tables || []).forEach(t => c.appendChild(table(t)));
    pd.appendChild(c);
  });

  document.getElementById("foot").textContent = D.rejected_older + "　這頁的內容都在檔頭 <script id=\"data\"> 的 JSON 裡；lab 結果出來改那裡即可。";
})();
