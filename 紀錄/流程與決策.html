<script>
(function () {

    const wrap = el("div", "");

      const val = (r) => r && r.v[k] != null ? fmtv(m, r.v[k]) : "—";
      const B3 = "g44tn_s20g70np16tricap0p5cmflattrimasklowresgeo8log0_best1maskdistrfed10b4", AD = "g44s30ksfm10fssh16di4_best1maskdistrfed10b4";
      lines.push(`<b>${esc(m.name)}</b>：新底 3 lab ${val(pick("lab", B3, 1))}／${val(pick("lab", B3, 4))}｜本機 ${val(pick("local", B3, 1))}／${val(pick("local", B3, 4))}｜A＋dist4 ${val(pick("lab", AD, 1))}／${val(pick("lab", AD, 4))}｜CityGS ${val(pick("ref", "CityGS", 1))}／${val(pick("ref", "CityGS", 4))}`);
    });
    c.appendChild(el("div", "note", lines.join("<br>")));
    const good = [], bad = [];
    ROWS.forEach(r => {
      if (r.machine === "local-old" || r.machine === "ref" || !r.base || r.base === r.id) return;
      a.keys.forEach(k => { const m = MK[k]; const d = delta(m, r); const c2 = cls(m, d); if (c2 === "g") good.push(`${esc(r.label)}（${r.group} b${r.blk}）${esc(m.name)} ${dtxt(m, d)}`); if (c2 === "b") bad.push(`${esc(r.label)}（${r.group} b${r.blk}）${esc(m.name)} ${dtxt(m, d)}`); });
    });
    const dd = el("details"); dd.appendChild(el("summary", "", `變好 ${good.length}／變差 ${bad.length}`));
    dd.appendChild(el("div", "inner", `<b>變好</b><ul>${good.slice(0, 40).map(x => "<li>" + x + "</li>").join("") || "<li>（無）</li>"}</ul><b>變差</b><ul>${bad.slice(0, 40).map(x => "<li>" + x + "</li>").join("") || "<li>（無）</li>"}</ul>`));
    c.appendChild(dd);
    ag.appendChild(c);
  });
  asec.appendChild(ag);

  // 逐跑次總帳
  const ls = document.getElementById("ledgersec");
  ls.appendChild(el("h2", "", `逐跑次總帳（${ROWS.length} 列）`));
  ls.appendChild(el("p", "note", `點一列展開：機制、備註、來源 log、全部數值。差值＝對同機器同塊的新底 3（舊底那一段對各自的基準）；綠／紅＝超出雜訊變好／變差。產生於 ${esc(LG.generated || "")}（python tools/report_ledger.py）。`));
  const ctr = el("div", "controls");
  const state = { blk: "all", grp: "all", st: "all", q: "", mode: "delta" };
  const mkgrp = (lab, key, opts) => { const g = el("div", "grp"); g.appendChild(el("span", "sub2", lab)); opts.forEach(([v, t]) => { const b = el("button", "", esc(t)); b.type = "button"; b.setAttribute("aria-pressed", String(state[key] === v)); b.onclick = () => { state[key] = v; g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); render(); }; g.appendChild(b); }); return g; };
  const blks = [...new Set(ROWS.map(r => r.blk))].sort((a, b) => a - b);
  ctr.appendChild(mkgrp("塊", "blk", [["all", "全部"]].concat(blks.map(b => [String(b), "b" + b]))));
  ctr.appendChild(mkgrp("來源", "grp", [["all", "全部"], ["lab", "lab"], ["本機", "本機"], ["CityGS", "CityGS"], ["11-06～08 本機舊底", "11-06～08 舊底"]]));
  ctr.appendChild(mkgrp("狀態", "st", [["all", "全部"], ["現行", "現行"], ["建議採用", "建議採用"], ["待驗證", "待驗證"], ["取捨", "取捨"], ["待評", "待評"], ["不採用", "不採用"], ["參考", "參考"], ["歷史", "歷史"]]));
  ctr.appendChild(mkgrp("顯示", "mode", [["delta", "差值"], ["raw", "原值"]]));
  const q = el("input"); q.type = "search"; q.placeholder = "搜尋名稱、機制、跑次"; q.oninput = () => { state.q = q.value.trim(); render(); }; ctr.appendChild(q);
  ls.appendChild(ctr);
  const tw = el("div", "tw"); tw.id = "ltw"; const tb = el("table"); tb.id = "ltbl"; tw.appendChild(tb); ls.appendChild(tw);
  const thead = el("thead"); const htr = el("tr");
  htr.appendChild(el("th", "", "跑次<span class=\"asp\">來源｜塊｜狀態</span>"));
  MET.forEach(m => htr.appendChild(el("th", "", `${esc(m.name)}${m.dir > 0 ? " ↑" : m.dir < 0 ? " ↓" : ""}<span class="asp">${esc(m.aspect)}</span>`)));
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody = el("tbody"); tb.appendChild(tbody);
  function render() {
    tbody.innerHTML = "";
    const qq = state.q.toLowerCase();
    ROWS.filter(r => (state.blk === "all" || String(r.blk) === state.blk) && (state.grp === "all" || r.group === state.grp) && (state.st === "all" || r.status === state.st)
      && (!qq || (r.label + " " + r.run + " " + (r.note || "")).toLowerCase().includes(qq))).forEach(r => {
      const isBase = r.base === r.id || !r.base;
      const tr = el("tr", "row" + (r.base === r.id ? " base" : ""));
      tr.appendChild(el("td", "", `${esc(r.label)}<div class="sub2">${esc(r.group)}｜b${r.blk}<span class="st ${esc(r.status)}">${esc(r.status)}</span></div>`));
      MET.forEach(m => {
        const v = r.v[m.key]; let txt = "", c2 = "";
        if (state.mode === "raw" || isBase) { txt = fmtv(m, v); }
        else if (m.key === "time_min" && (r.status === "歷史" || r.machine === "local-old")) { txt = fmtv(m, v); }   // 11-09～12 三槽平行跑，時間不可比
        else { const d = delta(m, r); txt = d == null ? fmtv(m, v) : dtxt(m, d); c2 = cls(m, d); }
        tr.appendChild(el("td", c2, txt));
      });
      tr.onclick = () => {
        const nx = tr.nextSibling;
        if (nx && nx.classList && nx.classList.contains("det")) { nx.remove(); return; }
        const det = el("tr", "det"); const td = el("td"); td.colSpan = MET.length + 1;
        const base = r.base && byId[r.base] ? byId[r.base].label : "（無）";
        td.innerHTML = `<b>${esc(r.label)}</b>｜跑次 <code>${esc(r.run)}</code>｜${esc(r.group)} b${r.blk}｜狀態 ${esc(r.status)}<br>${esc(r.note || "")}<br>差值基準：${esc(base)}｜來源：${esc((r.src || []).join("、"))}<br>`
          + MET.filter(m => r.v[m.key] != null).map(m => `${esc(m.name)} ${fmtv(m, r.v[m.key])}`).join("｜");
        det.appendChild(td); tr.after(det);
      };
      tbody.appendChild(tr);
    });
  }
  render();

  // 量法與雜訊
  const ms = document.getElementById("methods");
  ms.appendChild(el("h2", "", "量法與雜訊"));
  const ml = el("div", "mlist");
  MET.forEach(m => { ml.appendChild(el("b", "", `${esc(m.name)}${m.dir > 0 ? " ↑" : m.dir < 0 ? " ↓" : ""}`)); ml.appendChild(el("span", "", `${esc(m.def || "")}${m.noise ? `｜雜訊 ${m.mode === "pct" ? m.noise + "%" : m.noise}` : ""}`)); });
  ms.appendChild(ml);
  ms.appendChild(el("p", "note", "lab 的時間只在 [solo] 且卡上沒有外部行程時可比；本機時間約 lab 的 3 倍，只跟本機比。held-out（本機）只渲染這一塊，會混到塊外，定案一律看 lab 換塊。"));
  document.getElementById("foot").textContent = D.rejected_older + "　這頁的內容都在檔頭 <script id=\"data\"> 的 JSON 裡；lab 結果出來改那裡即可。";
})();
</script>
</body>
</html>
