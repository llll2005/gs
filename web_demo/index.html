<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CityGaussian Web Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: sans-serif; overflow: hidden; }
    canvas { display: block; }

    /* ── top progress bar ─────────────────────────────────────── */
    #prog-track {
      position: fixed; top: 0; left: 0; right: 0; height: 3px;
      z-index: 200; overflow: hidden; opacity: 0;
      transition: opacity 0.3s;
    }
    #prog-track.visible { opacity: 1; }
    #prog-bar {
      height: 100%; width: 0%;
      background: #4af;
      transition: width 0.25s ease, background 0.3s;
    }
    #prog-bar.indeterminate {
      width: 35% !important;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
    #prog-bar.done  { background: #4c8; }
    #prog-bar.error { background: #e44; width: 100% !important; animation: none; }

    /* ── stage label under progress bar ──────────────────────── */
    #prog-label {
      position: fixed; top: 6px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; color: #aaa;
      background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 10px;
      z-index: 200; opacity: 0; transition: opacity 0.3s;
      white-space: nowrap;
    }
    #prog-label.visible { opacity: 1; }

    /* ── side panel ───────────────────────────────────────────── */
    #ui {
      position: fixed; top: 24px; left: 16px; z-index: 10;
      background: rgba(0,0,0,0.6); border-radius: 8px; padding: 12px 16px;
      font-size: 13px; line-height: 1.8; min-width: 280px;
    }
    #ui h2 { font-size: 15px; margin-bottom: 4px; }
    #ui select {
      width: 100%; margin-top: 4px;
      background: #222; color: #eee; border: 1px solid #555;
      padding: 4px 6px; border-radius: 4px; font-size: 12px;
    }
    .btn {
      display: inline-block; cursor: pointer;
      background: #2a6; color: #fff;
      padding: 4px 10px; border-radius: 4px; font-size: 12px;
      margin-top: 6px;
    }
    #hint { color: #555; font-size: 11px; margin-top: 4px; }

    /* ── drop overlay ─────────────────────────────────────────── */
    #drop-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(30,100,200,0.18);
      border: 3px dashed #4af;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #4af;
      pointer-events: none; opacity: 0;
      transition: opacity 0.15s;
    }
    #drop-overlay.active { opacity: 1; }

    /* ── status bar ───────────────────────────────────────────── */
    /* 10-29：FPS（使用者要比 2.5M／1.5M／1M 在本機的流暢度；上限＝螢幕更新率） */
    #fps {
      position: fixed; top: 12px; right: 16px; font: 12px monospace; color: #9f9;
      background: rgba(0,0,0,0.55); padding: 4px 8px; border-radius: 4px; white-space: pre; pointer-events: none;
    }
    #status {
      position: fixed; bottom: 16px; left: 16px;
      font-size: 12px; color: #888;
      background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 4px;
    }
  </style>
</head>
<body>

<!-- progress bar -->
<div id="prog-track"><div id="prog-bar"></div></div>
<div id="prog-label"></div>

<!-- drop overlay -->
<div id="drop-overlay">放開以載入</div>

<!-- side panel -->
<div id="ui">
  <h2>CityGaussian Demo</h2>
  <div style="color:#aaa;font-size:11px">MatrixCity aerial · 2DGS · RTG-SLAM init</div>
  <div style="margin-top:8px">
    <select id="sel" onchange="loadByName(this.value)">
      <option disabled selected>— 尚無 .ply 檔案 —</option>
    </select>
  </div>
  <div class="pane-ctl" style="display:flex;gap:4px;align-items:center">
    <span class="tag">本機 ckpt</span>
    <select id="ckptSel" style="max-width:32em">
      <option disabled selected>— 載入中 —</option>
    </select>
  </div>
  <label class="btn">
    開啟 .ply / .ckpt
    <input id="filePicker" type="file" accept=".ply,.ckpt" style="display:none"
           onchange="handleFileInput(this)">
  </label>
  <span class="btn" onclick="goHome()">重新置中（F）</span>
  <label style="font-size:12px;margin-left:6px"><input id="autoFrame" type="checkbox" checked> 載入時自動置中</label>
  <div id="hint">拖曳 .ply 或 .ckpt 到視窗任意位置<br>雙擊：以該點為旋轉中心並拉近；滾輪：朝游標縮放</div>
</div>

<div id="status">就緒</div>
<div id="fps">FPS —</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// ── Scene ─────────────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 5000);
// 10-30：MatrixCity 的上方向是世界 +z（地面 z≈0）。OrbitControls 在建構時讀 camera.up => 要在建 controls 之前設，
//   這樣左右拖曳是繞鉛直軸轉、地平線保持水平（原本 +y 朝上時一轉就歪）。
camera.up.set(0, 0, 1);
camera.position.set(0, -30, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const spark    = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// 10-30 使用者「放大一定要有上限嗎、放越大越難調整」：沒有設上限（minDistance 0）。難調是因為滾輪縮放是「朝旋轉中心
//   按距離比例前進」，中心原本固定在原點、不在模型上（b6 離原點遠）=> 怎麼滾都靠不近。改成：縮放朝游標指的地方、
//   雙擊把旋轉中心移到點到的表面（見下方 dblclick）、載入時中心放在模型上（frameModel）。
controls.zoomToCursor = true;
controls.minDistance = 0;
controls.maxDistance = Infinity;

// ── DOM refs ──────────────────────────────────────────────────────────────
const sel          = document.getElementById("sel");
const statusEl     = document.getElementById("status");
const progTrack    = document.getElementById("prog-track");
const progBar      = document.getElementById("prog-bar");
const progLabel    = document.getElementById("prog-label");
const dropOverlay  = document.getElementById("drop-overlay");

// ── Progress bar ──────────────────────────────────────────────────────────
let hideTimer = null;

function setProgress(pct, label, state = "normal") {
  // state: "normal" | "indeterminate" | "done" | "error"
  clearTimeout(hideTimer);
  progTrack.classList.add("visible");
  progLabel.classList.add("visible");
  progLabel.textContent = label;

  progBar.classList.remove("indeterminate", "done", "error");
  if (state === "indeterminate") {
    progBar.classList.add("indeterminate");
  } else {
    progBar.style.width = pct + "%";
    if (state === "done")  progBar.classList.add("done");
    if (state === "error") progBar.classList.add("error");
  }

  statusEl.textContent = label;

  if (state === "done" || state === "error") {
    hideTimer = setTimeout(() => {
      progTrack.classList.remove("visible");
      progLabel.classList.remove("visible");
      progBar.style.width = "0%";
      progBar.classList.remove("done", "error");
    }, state === "done" ? 1500 : 4000);
  }
}

// ── Splat state ───────────────────────────────────────────────────────────
let currentSplat = null;
let currentFile  = null;
let lastTs       = 0;

async function loadSplat(url, label) {
  setProgress(null, `載入中：${label}`, "indeterminate");
  if (currentSplat) { scene.remove(currentSplat); currentSplat = null; }

  try {
    const splat = new SplatMesh({ url });
    scene.add(splat);
    currentSplat = splat;
    // 10-30：Spark 2.x 沒有 waitUntilReady（原本那行是 no-op）；initialized 才是載完的 Promise
    await (splat.initialized ?? splat.waitUntilReady?.());
    // 取消勾選＝換模型時保留目前視角（同一塊比較不同跑次時用）；範圍仍會更新給「重新置中」
    await frameModel(url, splat, document.getElementById("autoFrame").checked || !homeView);
    setProgress(100, label, "done");
  } catch (e) {
    setProgress(100, `錯誤：${e.message}`, "error");
    throw e;
  }
}

// ── 自動置中＋縮放到合適大小（10-30 使用者：CityGS 單塊較小、b6 離鏡頭遠 => 根本放不大） ──────────
// 範圍由伺服器算（/bounds.json：不透明顆粒的分位數，不被離群點與海面浮塊撐爆）；拿不到時退回 Spark 的中心點外接盒。
// 相機放在範圍中心的南方斜上 45°，距離＝讓外接球剛好塞進畫面（直、橫兩個方向取大的）。按 F 或「重新置中」回到這個視角。
let homeView = null;
async function frameModel(url, splat, move = true) {
  let lo = null, hi = null;
  if (!url.startsWith("blob:")) {
    try {
      const b = await fetch(`/bounds.json?file=${encodeURIComponent(url)}`).then(r => r.json());
      if (b.ok) { lo = new THREE.Vector3(...b.lo); hi = new THREE.Vector3(...b.hi); }
    } catch (_) {}
  }
  if (!lo) {
    // 退路（serve.py 是舊行程、沒有 /bounds.json 時）：⚠ 不能用 Spark 的 getBoundingBox —— 那是 min/max，
    //   會被盒外／海面／地底離群點撐爆（full44 塊內 b3 的 x 到 23.8、z 到 -21.3）=> 模型縮成一點。改成在瀏覽器裡抽樣算分位數（同伺服器的判準）。
    statusEl.textContent = "伺服器沒有 /bounds.json（重開 web_demo/serve.py 會比較快）=> 在瀏覽器抽樣算範圍…";
    try {
      const n = splat.numSplats ?? splat.packedSplats?.numSplats ?? 0;
      const step = Math.max(1, Math.floor(n / 300000));
      const xs = [], ys = [], zs = [];
      splat.forEachSplat((i, c, _s, _q, o) => {
        if (i % step === 0 && o > 0.5 && Number.isFinite(c.x + c.y + c.z)) { xs.push(c.x); ys.push(c.y); zs.push(c.z); }
      });
      if (xs.length > 100) {
        const q = (a, t) => { a.sort((u, v) => u - v); return a[Math.min(a.length - 1, Math.floor(t * a.length))]; };
        lo = new THREE.Vector3(q(xs, 0.05), q(ys, 0.05), q(zs, 0.02));
        hi = new THREE.Vector3(q(xs, 0.95), q(ys, 0.95), q(zs, 0.99));
      }
    } catch (_) {}
  }
  if (!lo) return;
  const c = lo.clone().add(hi).multiplyScalar(0.5);
  const r = Math.max(hi.clone().sub(lo).length() / 2, 1e-3);
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = 0.9 * r / Math.sin(Math.min(vfov, hfov) / 2);   // 外接球偏保守（45° 斜看時投影比球小）=> 0.9 讓模型大致填滿畫面
  homeView = { target: c.clone(), pos: c.clone().addScaledVector(new THREE.Vector3(0, -1, 1).normalize(), d), d };
  if (move) goHome();
}
function goHome() {
  if (!homeView) return;
  controls.target.copy(homeView.target);
  camera.position.copy(homeView.pos);
  camera.near = Math.max(homeView.d * 1e-4, 1e-6);   // 拉到很近（貼著立面）也不會被近平面切掉
  camera.far  = homeView.d * 200;
  camera.updateProjectionMatrix();
  controls.update();
}
window.goHome = goHome;
window.addEventListener("keydown", e => {
  if ((e.key === "f" || e.key === "F") && !(e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)) goHome();
});

// 雙擊：把旋轉中心移到點到的表面（Spark 的 SplatMesh 支援 three.js Raycaster），同時拉近一半
//   => 之後滾輪縮放、旋轉都繞著那一點，想看哪裡就雙擊哪裡，不再需要放大上限。點到空白處就用目前中心深度上的那一點。
const _ray = new THREE.Raycaster();
renderer.domElement.addEventListener("dblclick", e => {
  const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  _ray.setFromCamera(ndc, camera);
  let p = null;
  if (currentSplat) {
    try { const hit = _ray.intersectObject(currentSplat, false); if (hit.length) p = hit[0].point.clone(); } catch (_) {}
  }
  if (!p) p = _ray.ray.at(camera.position.distanceTo(controls.target), new THREE.Vector3());
  const off = camera.position.clone().sub(controls.target).multiplyScalar(0.5);
  controls.target.copy(p);
  camera.position.copy(p).add(off);
  controls.update();
});

// ── Load from server-side filename ────────────────────────────────────────
window.loadByName = async function(filename) {
  if (filename === currentFile) return;
  currentFile = filename;
  await loadSplat(filename, filename);
};

// ── Upload file to server then load from server URL ───────────────────────
async function uploadToServer(file, endpoint, plyName, stageLabel) {
  const sizeMB = (file.size / 1e6).toFixed(1);

  // cache check
  const cached = await fetch("/files.json").then(r => r.json()).catch(() => []);
  if (cached.includes(plyName)) {
    setProgress(100, `已有快取：${plyName}`, "done");
    await refreshFileList();
    sel.value = plyName;
    currentFile = null;
    await loadSplat(plyName, plyName);
    return;
  }

  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        setProgress(pct, `${stageLabel}：${file.name}  ${pct}%  (${sizeMB} MB)`);
      }
    };
    xhr.onload = async () => {
      if (xhr.status !== 200) {
        setProgress(100, `伺服器錯誤 ${xhr.status}`, "error");
        return reject(new Error(`HTTP ${xhr.status}`));
      }
      const res = JSON.parse(xhr.responseText);
      if (!res.ok) {
        setProgress(100, `失敗：${res.error}`, "error");
        return reject(new Error(res.error));
      }
      await refreshFileList();
      sel.value = res.file;
      currentFile = null;
      await loadSplat(res.file, res.file).then(resolve).catch(reject);
    };
    xhr.onerror = () => {
      setProgress(100, "連線失敗 — serve.py 是否正在執行？", "error");
      reject(new Error("upload failed"));
    };
    setProgress(0, `準備上傳：${file.name}  (${sizeMB} MB)`);
    xhr.open("POST", endpoint);
    xhr.setRequestHeader("X-Filename", plyName);
    xhr.send(file);
  });
}

// ── Upload .ply → server stores → load from server URL ───────────────────
async function uploadPly(file) {
  const mb = Math.round(file.size / 1e6);
  const plyName = file.name.replace(/\.ply$/, "") + `_${mb}mb.ply`;
  await uploadToServer(file, "/upload", plyName, "上傳");
}

// ── Upload .ckpt → server converts → load PLY ────────────────────────────
async function uploadAndConvert(file) {
  const mb = Math.round(file.size / 1e6);
  const plyName = file.name.replace(/\.ckpt$/, "") + `_${mb}mb.ply`;
  await uploadToServer(file, "/convert", plyName, "上傳");
}

// wait for converting stage after upload completes
const _origLoadSplat = loadSplat;
// patch: show "converting" between upload finish and splat load
async function loadSplatWithConvertStage(url, label) {
  if (!url.endsWith(".ply") || url.startsWith("blob:")) {
    return _origLoadSplat(url, label);
  }
  setProgress(null, `轉換中，請稍候…`, "indeterminate");
  return _origLoadSplat(url, label);
}

// ── File input handler ────────────────────────────────────────────────────
async function handleFile(file) {
  if (!file) return;

  // read first 4 bytes to detect actual format regardless of extension
  const magic = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const isPly  = magic[0] === 0x70 && magic[1] === 0x6C && magic[2] === 0x79; // 'ply'
  const isCkpt = magic[0] === 0x50 && magic[1] === 0x4B;                      // 'PK' (zip)

  if (isPly)       uploadPly(file);
  else if (isCkpt) uploadAndConvert(file);
  else setProgress(100, `無法識別格式（${file.name}）`, "error");
}

window.handleFileInput = (input) => { handleFile(input.files[0]); input.value = ""; };

// ── Drag & drop ───────────────────────────────────────────────────────────
let dragCount = 0;
document.addEventListener("dragenter", e => {
  if ([...e.dataTransfer.items].some(i => i.kind === "file")) {
    dragCount++;
    dropOverlay.classList.add("active");
  }
});
document.addEventListener("dragleave", () => {
  if (--dragCount <= 0) { dragCount = 0; dropOverlay.classList.remove("active"); }
});
document.addEventListener("dragover",  e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  dragCount = 0;
  dropOverlay.classList.remove("active");
  handleFile(e.dataTransfer.files[0]);
});

// ── 本機 ckpt：不上傳、不拖放 ─────────────────────────────────────────────
// 檔案本來就在同一台機器上（60k 的 ckpt 是 1.6 GB），走瀏覽器上傳是繞遠路，
// 而且在這台機器上 Wayland 的拖放送不出 dataTransfer（types 全空）=> 這條完全繞開兩者。
const ckptSel = document.getElementById("ckptSel");
async function refreshCkptList() {
  const cks = await fetch("/ckpts.json").then(r => r.json()).catch(() => []);
  ckptSel.innerHTML = "";
  if (!cks.length) {
    ckptSel.innerHTML = '<option disabled selected>— 找不到 outputs/**/{checkpoints,deploy}/*.ckpt —</option>';
    return;
  }
  const head = document.createElement("option");
  head.disabled = true; head.selected = true;
  head.textContent = `— 選一個 ckpt（${cks.length} 個，最新的在最上面）—`;
  ckptSel.appendChild(head);
  for (const c of cks) {
    const o = document.createElement("option");
    o.value = c.path;
    o.textContent = `${c.path.replace(/^outputs\//, "")}  (${c.mb} MB)`;
    ckptSel.appendChild(o);
  }
}
ckptSel.addEventListener("change", async () => {
  const path = ckptSel.value;
  if (!path) return;
  setProgress(null, `伺服器轉檔中（不上傳）：${path}`, "indeterminate");
  try {
    const r = await fetch("/convert_local", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    }).then(r => r.json());
    if (!r.ok) { setProgress(100, `轉檔失敗：${r.error}`, "error"); return; }
    setProgress(100, r.cached ? `已有快取：${r.file}` : `轉檔完成：${r.file}`, "done");
    await refreshFileList();
    sel.value = r.file;
    currentFile = null;
    await loadSplat(r.file, r.file);
  } catch (e) {
    setProgress(100, `轉檔失敗：${e}`, "error");
  }
});

// ── Server file list ──────────────────────────────────────────────────────
async function refreshFileList() {
  const files = await fetch("/files.json").then(r => r.json()).catch(() => []);
  const prev  = [...sel.options].map(o => o.value);
  const added = files.filter(f => !prev.includes(f));
  for (const f of added) {
    const opt = document.createElement("option");
    opt.value = opt.textContent = f;
    sel.appendChild(opt);
  }
  if (files.length > 0 && sel.options[0]?.disabled) sel.remove(0);
}

async function pollCurrent() {
  try {
    const data = await fetch("/current.json").then(r => r.json());
    if (data.ts > lastTs && data.file) {
      lastTs = data.ts;
      await refreshFileList();
      sel.value = data.file;
      currentFile = null;
      await loadSplat(data.file, data.file);
    }
  } catch (_) {}
}

// ── Init ──────────────────────────────────────────────────────────────────
await refreshFileList();
refreshCkptList();          // 不 await：掃 outputs/ 不該擋住第一個檔的顯示
if (sel.options.length && !sel.options[0].disabled) {
  await loadByName(sel.options[0].value);
} else {
  statusEl.textContent = "拖曳 .ply 或 .ckpt 進來開始";
}

setInterval(pollCurrent,     1500);
setInterval(refreshFileList, 5000);

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── FPS：每秒更新一次；平均＝幀數／秒，最慢＝這一秒內最長的一幀（卡頓看這個） ──
const fpsEl = document.getElementById("fps");
let fpsN = 0, fpsT0 = performance.now(), fpsPrev = fpsT0, fpsWorst = 0;
renderer.setAnimationLoop(() => {
  controls.update(); renderer.render(scene, camera);
  const now = performance.now(); fpsWorst = Math.max(fpsWorst, now - fpsPrev); fpsPrev = now; fpsN++;
  if (now - fpsT0 >= 1000) {
    const fps = fpsN * 1000 / (now - fpsT0);
    const n = currentSplat?.numSplats ?? currentSplat?.packedSplats?.numSplats;
    fpsEl.textContent = `FPS ${fps.toFixed(1)}  平均 ${(1000 / fps).toFixed(1)} ms  最慢 ${fpsWorst.toFixed(0)} ms` +
                        (n ? `\n顆數 ${n.toLocaleString()}` : "");
    fpsN = 0; fpsT0 = now; fpsWorst = 0;
