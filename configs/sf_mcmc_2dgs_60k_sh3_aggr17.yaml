# SF-MCMC arm1: aggr17 recipe with the ONLY change = density controller swapped to
# SFMCMC2DGSDensityController (split-funded MCMC). Baseline arm0 = mcmc_2dgs_60k_sh3_
# aggr17_aerial.yaml (block_7 = 24.30/0.755/0.309 @ 1.53M).
# arm2 (signal ablation) = this config + --model.density.init_args.split_candidate_mode random
# Run: python main.py fit --config configs/sf_mcmc_2dgs_60k_sh3_aggr17.yaml --model.initialize_from data/matrix_city/aerial/train/block_all/depth_init/block_7.ply --data.parser.block_id 7 -n sf_mcmc_60k_sh3_aggr17_b7
model:
  initialize_from: null          # depth-init via CLI (see header)
  overwrite_config: False
  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 3
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 60_000
        scales_lr: 0.004
  metric:
    class_path: internal.metrics.mcmc_citygsv2_metrics.MCMCCityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.05
        max_steps: 60_000
      opacity_reg: 0.007
      scale_reg: 0.007
      immune_opacity_threshold: 0.9
  renderer:
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
  density:
    class_path: internal.density_controllers.sf_mcmc_density_controller.SFMCMC2DGSDensityController
    init_args:
      cap_max: 1700000
      noise_lr: 500000.0
      densify_from_iter: 1000
      densify_until_iter: 42_000
      densification_interval: 150
      min_opacity: 0.005
      N_max: 51
      # non-split budget stays byte-identical to base MCMC
      relocation_weight_mode: opacity
      # split op (the single variable vs arm0)
      split_fraction: 0.5
      split_top_q: 0.05
      split_candidate_mode: grad_scale
      split_min_opacity: 0.1
      split_offset_sigma: 0.5
      split_scale_shrink: 1.6
trainer:
  check_val_every_n_epoch: 20
  max_steps: 60000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      image_dir: input
      down_sample_factor: 1.2
      content_threshold: 0.08
      min_images_per_block: 10
      block_dim:
      - 5
      - 5
  num_workers: 8
save_iterations:
- 500
- 1500
- 15000
- 30000
- 42000
- 60000
