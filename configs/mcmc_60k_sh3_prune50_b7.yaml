# 60k regime 重驗 importance-prune（Slide 5 的待補實測）。
# = aggr17（sh3/cap1.7M→1.53M）+ 在 step 45000（densify 42k 結束後）importance-prune 砍 50% → ~765k → 精修到 60k。
# 對照 native（mcmc_60k_sh3_native765_b7，直接低 cap 到 ~765k）。判：prune 是否仍 +0.4~0.5 贏 native（30k 時 +0.457）。
model:
  initialize_from: null
  overwrite_config: False
  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 3
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 60_000
        scales_lr: 0.004
  metric:
    class_path: internal.metrics.mcmc_citygsv2_metrics.MCMCCityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.05
        max_steps: 60_000
      opacity_reg: 0.007
      scale_reg: 0.007
      immune_opacity_threshold: 0.9
  renderer:
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
  density:
    class_path: internal.density_controllers.mcmc_2dgs_density_controller.MCMC2DGSDensityController
    init_args:
      cap_max: 1700000
      noise_lr: 500000.0
      densify_from_iter: 1000
      densify_until_iter: 42_000
      densification_interval: 150
      min_opacity: 0.005
      N_max: 51
  light_gaussian:
    prune_steps:
    - 45000
    prune_decay: 1.0
    prune_percent: 0.5
    prune_type: v_important_score
    v_pow: 0.1
trainer:
  check_val_every_n_epoch: 20
  max_steps: 60000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      image_dir: input
      down_sample_factor: 1.2
      content_threshold: 0.08
      min_images_per_block: 10
      block_dim:
      - 5
      - 5
  num_workers: 8
save_iterations:
- 45000
- 60000
