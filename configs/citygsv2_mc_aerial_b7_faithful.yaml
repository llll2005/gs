# 嚴謹版 CityGSV2 重跑 @ block_7。演算法 = 官方 citygsv2_mc_aerial_sh2_trim.yaml（上游確認）；
# 資料 = 我們的（5x5 / content 0.08 / down_sample 1.2）以對齊 24.30。
# init = 全域 4.39M coarse 經「離線可見性裁切」(tools/visibility_crop_ckpt.py) 到 block_7 可見的 258k，
#        = 精確複製原文 step-1 trimming，但離線 forward-only 故塞進 6GB（原文靠 8xA100 在 step1 直接做）。
# renderer 取自 ckpt（已 patch 成官方 fine：trim on / prune_ratio 0.1 / depth_ratio 1.0）。
# grad-densify 無 cap：densify 峰值(~step30k)是 6GB OOM 風險點，盯著。
model:
  initialize_from: outputs/aerial_train_block_all_3x/checkpoints/coarse_block7_viscrop_sh2.ckpt
  overwrite_config: False
  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 2
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 60_000
        scales_lr: 0.004
  metric:
    class_path: internal.metrics.citygsv2_metrics.CityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.05
        max_steps: 60_000
  renderer:   # 注意：.ckpt init 會用 ckpt 內的 renderer（已 patch），此區僅備查
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
      prune_ratio: 0.1
  density:
    class_path: internal.density_controllers.citygsv2_density_controller.CityGSV2DensityController
    init_args:
      densification_interval: 200
      opacity_reset_interval: 6000
      densify_from_iter: 1000
      densify_until_iter: 30_000
      densify_grad_threshold: 0.0002
trainer:
  check_val_every_n_epoch: 20
  max_steps: 60000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      down_sample_factor: 1.2
      content_threshold: 0.08
      block_dim:
      - 5
      - 5
  num_workers: 8
save_iterations:
- 15000
- 30000
- 60000
