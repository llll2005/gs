model:
  # initialize_from: provided at runtime via --model.initialize_from or train_citygs_partitions.py --depth_init_dir
  initialize_from: null
  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 2
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 30_000
        scales_lr: 0.004
  metric:
    class_path: internal.metrics.citygsv2_metrics.CityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.001
        max_steps: 15_000
  renderer:
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
  density:
    class_path: internal.density_controllers.rtg_stable_density_controller.RTGStableDensityController
    init_args:
      # ── RTGStable base（與 RTG_mc_no_ADDM_aerial_sh2_trim 完全相同）──────────
      stable_threshold: 10
      depth_init_immune: true
      densify_grad_threshold: 0.00005
      densification_interval: 400
      opacity_reset_interval: 2000
      densify_from_iter: 1000
      densify_until_iter: 15_000
      # ── S10 B1：opacity 凍結（α = 0.99 opaque / 0.1 transparent，lr_α = 0）──
      # lifecycle 由 B4+B5 接管，opacity-based pruning 停用
      freeze_opacity: false
      # ── S10 B3：M_c transparent Gaussian adding（α=0.1，5% 採樣）────────────
      mc_enabled: true
      mc_color_threshold: 0.1
      mc_sample_ratio: 0.05
      mc_transparent_alpha: 0.1
      mc_scale_factor: 0.01
      # ── S10 B4：stable→unstable reversion（δ_e=5 次高誤差才 revert）──────────
      stable_revert_enabled: true
      stable_revert_threshold: 0.1
      stable_revert_count: 5
      # ── S10 B5：長期 unstable 剔除（50 × 500 = 25000 steps 後仍 unstable → prune）
      max_unstable_intervals: 50
trainer:
  check_val_every_n_epoch: 15
  max_steps: 30000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      image_dir: input
      down_sample_factor: 1.2
      content_threshold: 0.08
      min_images_per_block: 10
      block_dim:
        - 5
        - 5
  num_workers: 8
save_iterations:
  - 500
  - 1500
  - 15000
  - 30000

