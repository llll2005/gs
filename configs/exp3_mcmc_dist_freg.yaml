model:
  initialize_from: null
  gaussian:
    class_path: internal.models.gaussian_2d.Gaussian2D
    init_args:
      sh_degree: 2
      optimization:
        means_lr_init: 0.000064
        means_lr_scheduler:
          lr_final: 0.00000064
          max_steps: 30_000
        scales_lr: 0.004
  metric:
    # CityGSV2 metrics + MCMC's two L1 regs (opacity_reg/scale_reg) with an immune moat
    # protecting alpha=0.99 surfels. See internal/metrics/mcmc_citygsv2_metrics.py.
    class_path: internal.metrics.freegs_metrics.FreGSMCMCCityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.001
        max_steps: 15_000
      opacity_reg: 0.01
      scale_reg: 0.01
      immune_opacity_threshold: 0.9
      lambda_freq: 0.05
      lambda_dist: 100.0
  renderer:
    class_path: internal.renderers.sep_depth_trim_2dgs_renderer.SepDepthTrim2DGSRenderer
    init_args:
      depth_ratio: 1.0
  density:
    # MCMC for 2D surfels: relocate dead + add_new to cap_max + tangent-plane noise.
    # Replaces RTGStable's clone/split/opacity-reset/size-prune entirely (see 紀錄/主線_Gaussian效率.md §3).
    # NOTE: opacity_reg / scale_reg L1 (MCMC's prune replacements) live in the metric/loss, NOT here —
    # not yet wired; first smoke-test relocate+noise+cap, then add the two L1 regs.
    class_path: internal.density_controllers.mcmc_2dgs_density_controller.MCMC2DGSDensityController
    init_args:
      cap_max: 800000              # fixed Gaussian budget (6GB target). block7 depth baseline ~453k
      noise_lr: 500000.0           # MCMC default 5e5
      densify_from_iter: 1000
      densify_until_iter: 15_000
      densification_interval: 100  # MCMC default (RTG used 500)
      min_opacity: 0.005           # dead_mask threshold
      N_max: 51
trainer:
  check_val_every_n_epoch: 15
  max_steps: 30000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      image_dir: input
      down_sample_factor: 1.2
      content_threshold: 0.08
      min_images_per_block: 10
      block_dim:
      - 5
      - 5
  num_workers: 8
save_iterations:
- 500
- 1500
- 15000
- 30000
