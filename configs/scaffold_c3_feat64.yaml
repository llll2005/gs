model:
  initialize_from: null
  gaussian:
    class_path: internal.models.scaffold_gaussian_2d.ScaffoldGaussian2D
    init_args:
      sh_degree: 0
      feat_dim: 64
      n_offsets: 5
      voxel_size: 0
      max_anchors: 50000           # initial; anchor growing adds more (capped by density max_total_anchors)
      init_ply_path: data/matrix_city/aerial/train/block_all/depth_init/block_7.ply
      anchor_lr: 0.000064          # ★ unfrozen anchor positions (was 0)
      offset_lr: 0.01
      feature_lr: 0.015
      anchor_scaling_lr: 0.007
      mlp_lr: 0.008
      optimization:
        spatial_lr_scale: -1
  metric:
    class_path: internal.metrics.scaffold_citygsv2_metrics.ScaffoldCityGSV2Metrics
    init_args:
      lambda_normal: 0.0125
      normal_regularization_from_iter: 0
      depth_loss_type: l1+ssim
      depth_loss_ssim_weight: 1.0
      depth_loss_weight:
        init: 0.5
        final_factor: 0.05
        max_steps: 30_000
  renderer:
    class_path: internal.renderers.scaffold_2dgs_renderer.Scaffold2DGSRenderer
    init_args:
      depth_ratio: 1.0
      diable_trimming: true
  density:
    class_path: internal.density_controllers.scaffold_density_controller.ScaffoldDensityController
    init_args:
      densify_from_iter: 1500
      densify_until_iter: 15000
      update_interval: 100
      densify_grad_threshold: 0.00005
      min_opacity: 0.005
      success_threshold: 0.8
      max_total_anchors: 150000
trainer:
  check_val_every_n_epoch: 15
  max_steps: 30000
data:
  path: data/matrix_city/aerial/train/block_all
  parser:
    class_path: EstimatedDepthBlockColmap
    init_args:
      image_dir: input
      down_sample_factor: 1.2
      content_threshold: 0.08
      min_images_per_block: 10
      block_dim:
      - 5
      - 5
  num_workers: 8
save_iterations:
- 500
- 15000
- 30000
